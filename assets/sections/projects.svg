<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-labelledby="t-04 d-04">
<title id="t-04">04 Featured projects</title>
<desc id="d-04">Section heading 04: Featured projects</desc>
<defs>
  <linearGradient id="pillg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f172a"/>
    <stop offset="1" stop-color="#111c3a"/>
  </linearGradient>
  <linearGradient id="lineg" gradientUnits="userSpaceOnUse" x1="446" y1="45" x2="1196" y2="45">
    <stop offset="0" stop-color="#1d4ed8" stop-opacity="1"/>
    <stop offset="0.7" stop-color="#7c3aed" stop-opacity="1"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glyg">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="dotg">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.95"/>
    <stop offset="0.35" stop-color="#7c3aed" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <style>
  .ico{fill:none;stroke:#e2e8f0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .thick{stroke-width:3.2}
  .acc{stroke:#38bdf8}
  .glowc{fill:url(#glyg)}
  .spark{fill:#38bdf8}
  .tile{fill:rgba(56,189,248,.16);stroke:#38bdf8;stroke-width:1.6}
  .tile.v{fill:rgba(167,139,250,.18);stroke:#a78bfa}
  .bar{fill:#38bdf8;opacity:.9}
  .bar.hi{fill:#a78bfa}
  .pill{fill:url(#pillg);stroke:rgba(148,163,184,.18);stroke-width:1}
  .sheen{fill:none;stroke:#38bdf8;stroke-opacity:.07;stroke-width:1}
  .divider{stroke:rgba(148,163,184,.28);stroke-width:1}
  .idx{font-family:'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:13px;font-weight:600;fill:#38bdf8;letter-spacing:.5px}
  .ttl{font-family:'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif;font-size:26px;font-weight:800;fill:#e2e8f0}
  .rail{fill:none;stroke:url(#lineg);stroke-width:2.5;stroke-linecap:round}
  .dot-glow{fill:url(#dotg)}
  .dot-core{fill:#e2e8f0}
  .travel{opacity:0}
  @media (prefers-reduced-motion: no-preference) {
    .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .8s cubic-bezier(.4,0,.2,1) forwards}
    .travel{animation:travel 5s linear .8s infinite both}
    .enter{animation:enter .7s cubic-bezier(.2,.7,.2,1) .15s both}
    .glowc{animation:glow 3.2s ease-in-out infinite}
    .blink{animation:blink 1.1s steps(1,end) infinite}
    .twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.4s ease-in-out infinite}
    .bob{animation:bob 3s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .55s ease-in-out infinite alternate}
    .sq-tl{animation:asm-tl 4.4s cubic-bezier(.3,.7,.2,1) infinite}
    .sq-tr{animation:asm-tr 4.4s cubic-bezier(.3,.7,.2,1) infinite}
    .sq-bl{animation:asm-bl 4.4s cubic-bezier(.3,.7,.2,1) infinite}
    .sq-br{animation:asm-br 4.4s cubic-bezier(.3,.7,.2,1) infinite}
    .lyr{animation:lyr 3.6s ease-in-out infinite}
    .l2{animation-delay:-1.2s}
    .l3{animation-delay:-2.4s}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3.2s ease-in-out infinite}
    .b2{animation-delay:-.5s}
    .b3{animation-delay:-1.1s}
    .b4{animation-delay:-1.7s}
    .pring{transform-box:fill-box;transform-origin:50% 50%;animation:pring 2s ease-out infinite}
    .plane{animation:fly 3.2s ease-in-out infinite}
  }
  @keyframes draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
  @keyframes travel{0%{transform:translateX(0);opacity:0}4%{opacity:1}90%{opacity:1}100%{transform:translateX(750px);opacity:0}}
  @keyframes enter{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}
  @keyframes blink{0%{opacity:1}50%{opacity:0}}
  @keyframes twinkle{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.15);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  @keyframes flame{from{transform:scaleY(.7)}to{transform:scaleY(1.2)}}
  @keyframes asm-tl{0%{transform:translate(-8px,-8px);opacity:0}25%,75%{transform:translate(0,0);opacity:1}100%{transform:translate(-8px,-8px);opacity:0}}
  @keyframes asm-tr{0%{transform:translate(8px,-8px);opacity:0}25%,75%{transform:translate(0,0);opacity:1}100%{transform:translate(8px,-8px);opacity:0}}
  @keyframes asm-bl{0%{transform:translate(-8px,8px);opacity:0}25%,75%{transform:translate(0,0);opacity:1}100%{transform:translate(-8px,8px);opacity:0}}
  @keyframes asm-br{0%{transform:translate(8px,8px);opacity:0}25%,75%{transform:translate(0,0);opacity:1}100%{transform:translate(8px,8px);opacity:0}}
  @keyframes lyr{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  @keyframes pring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  @keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5px,-1.5px)}}
</style>
</defs>

  <rect class="pill" x="4" y="12" width="420" height="66" rx="16"/>
  <rect class="sheen" x="5" y="13" width="418" height="64" rx="15"/>
<g class="enter">
  <g transform="translate(24 30)">
    <circle class="glowc" cx="15" cy="15" r="17"/>
    <rect class="tile sq-tl" x="2" y="2" width="12" height="12" rx="2.5"/>
    <rect class="tile sq-tr" x="16" y="2" width="12" height="12" rx="2.5"/>
    <rect class="tile sq-bl" x="2" y="16" width="12" height="12" rx="2.5"/>
    <rect class="tile v sq-br" x="16" y="16" width="12" height="12" rx="2.5"/>
  </g>
  <text class="idx" x="76" y="50">04</text>
  <line class="divider" x1="98" y1="28" x2="98" y2="62"/>
  <text class="ttl" x="112" y="54">Featured projects</text>
</g>
<path class="rail draw" d="M446 45 H1196" pathLength="100"/>
<g class="travel">
  <circle class="dot-glow" cx="446" cy="45" r="10"/>
  <circle class="dot-core" cx="446" cy="45" r="2.6"/>
</g>
</svg>
