@keyframes shim{to{stroke-dashoffset:-1000}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){
*{animation:none!important}
.fr{display:none}
.shim,.scan{opacity:0}
