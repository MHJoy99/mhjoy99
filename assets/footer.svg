  <text x="600" y="95" text-anchor="middle" class="mono" font-size="14" letter-spacing="1.5" fill="#94a3b8">MHJoy99 <tspan fill="#38bdf8">·</tspan> github.com/MHJoy99</text>
</g>
<rect x="8.5" y="8.5" width="1183" height="123" rx="19.5" fill="none" stroke="#94a3b8" stroke-opacity=".22"/>
<rect x="8.5" y="8.5" width="1183" height="123" rx="19.5" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="160 840" class="edge live"/>
</svg>
