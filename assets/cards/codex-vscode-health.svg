<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="t2 d2">
  <title id="t2">codex-vscode-health</title>
  <desc id="d2">Pre-flight health gate for VS Code Remote that prevents Codex sidebar renderer_ready_timeout under memory/extension pressure. Shell project by MH Joy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0.5" y="0.5" width="599" height="219" rx="18"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .content { animation: rise .6s ease-out .15s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .sheen { animation: shimmer 7s ease-in-out infinite; }
    @keyframes shimmer { 0% { transform: translateX(-420px); } 40%, 100% { transform: translateX(420px); } }
    .beat { stroke-dasharray: 100 100; animation: beat 3.6s ease-in-out infinite; }
    @keyframes beat {
      0% { stroke-dashoffset: 100; opacity: 1; }
      35% { stroke-dashoffset: 0; opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .check { animation: check 3.6s ease-in-out infinite; }
    @keyframes check {
      0%, 40% { opacity: 0; }
      50%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .accent, .content { animation: none; }
      .accent { transform: none; }
      .sheen { display: none; }
      .beat { animation: none; stroke-dasharray: none; }
      .check { animation: none; opacity: 1; }
    }
  </style>

  <!-- card background + shimmer, clipped to the rounded card -->
  <g clip-path="url(#clip)">
    <rect x="0.5" y="0.5" width="599" height="219" rx="18" fill="url(#bg)"/>
    <g transform="rotate(20 300 110)">
      <rect class="sheen" x="230" y="-160" width="150" height="540" fill="url(#sheen)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="219" rx="18" fill="none" stroke="#94a3b8" stroke-opacity=".18" stroke-width="1"/>

  <!-- accent line on the top edge, grows on load -->
  <rect class="accent" x="18" y="0" width="564" height="2" fill="url(#accent)"/>

  <g class="content">
    <!-- glyph tile + code brackets with a pulse line and a check -->
    <g transform="translate(28 30)">
      <rect width="44" height="44" rx="12" fill="url(#accent)"/>
      <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 14 L6 22 L11 30"/>
        <path d="M33 14 L38 22 L33 30"/>
        <path class="beat" pathLength="100" d="M13 22 H17 L19.5 16 L23 28 L25.5 22 H31"/>
        <path class="check" d="M28 7 L31 10 L36.5 4.5"/>
      </g>
    </g>

    <text x="88" y="52" font-size="24" font-weight="800" fill="#e2e8f0">codex-vscode-health</text>
    <circle cx="93" cy="70" r="5" fill="#89e051"/>
    <text x="104" y="74" font-size="13" fill="#94a3b8">Shell<tspan> &#183; </tspan>dev tooling</text>

    <text x="88" y="110" font-size="15" fill="#cbd5e1">Pre-flight health gate for VS Code Remote that prevents Codex</text>
    <text x="88" y="132" font-size="15" fill="#cbd5e1">sidebar renderer_ready_timeout under memory/extension pressure.</text>

    <g font-size="12" fill="#cbd5e1" text-anchor="middle">
      <rect x="88" y="164" width="108" height="22" rx="10" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".25"/>
      <text x="142" y="179">VS Code Remote</text>
      <rect x="206" y="164" width="114" height="22" rx="10" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".25"/>
      <text x="263" y="179">pre-flight gate</text>
      <rect x="330" y="164" width="52" height="22" rx="10" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".25"/>
      <text x="356" y="179">Codex</text>
    </g>
    <text x="572" y="180" font-size="12" fill="#38bdf8" text-anchor="end">&#8594; view repo</text>
  </g>
</svg>
